services:
  # ============================================================================
  # Backend API & Real-time WebSocket Server
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supportflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/supportflow}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - JWT_SECRET=${JWT_SECRET:-supportflow_production_jwt_secret_key_minimum_32_chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supportflow_production_jwt_refresh_secret_minimum_32_chars}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=uploads
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - backend_uploads:/app/uploads
      - backend_uploads:/app/backend/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - supportflow-network

  # ============================================================================
  # Frontend React SPA served by Nginx
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: supportflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - supportflow-network

  # ============================================================================
  # Local MongoDB Service (used if external MONGODB_URI is not provided)
  # ============================================================================
  mongo:
    image: mongo:7.0
    container_name: supportflow-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - supportflow-network

  # ============================================================================
  # Redis Distributed Cache & BullMQ Queue Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: supportflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - supportflow-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mongo_data:
    name: supportflow_mongo_data
  redis_data:
    name: supportflow_redis_data
  backend_uploads:
    name: supportflow_backend_uploads

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  supportflow-network:
    name: supportflow-network
    driver: bridge
