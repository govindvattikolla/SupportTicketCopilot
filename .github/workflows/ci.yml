name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # 1. Quality, Typecheck, and Automated Tests
  # ============================================================================
  test-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: TypeScript Type Checking (Backend & Frontend)
        run: npm run typecheck

      - name: Run Backend Vitest Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_minimum_32_characters_long_12345

      - name: Build Frontend & Backend Bundles
        run: npm run build

  # ============================================================================
  # 2. Docker Container Verification
  # ============================================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: supportflow-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: supportflow-frontend:test

  # ============================================================================
  # 3. Continuous Deployment (Runs only on main branch after tests & builds pass)
  # ============================================================================
  deploy:
    name: Production Deployment Trigger
    runs-on: ubuntu-latest
    needs: [test-and-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Backend Deploy (Render Deploy Hook)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated backend redeployment on Render..."
          curl -f -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Deployment signal sent successfully!"

